name: Cypress E2E Tests

on:
  push:
    branches:
      - developer
      - main

  pull_request:
    branches:
      - developer
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    env:
      ENV_FILE: .env.qa
      CI: true
      allure: true

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npm run cy:run:qa

      - name: Verificar Allure Results
        if: always()
        run: |
          ls -la allure-results || true
          find allure-results -type f || true

      - name: Instalar Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.29.0

      - name: Gerar relatório Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  deploy-report:
    if: always()
    needs: cypress-run
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publicar relatório no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4